<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Presence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06090b;
    --fg: #eef1f2;
    --muted: #8a969b;
    --line: #3c4a4d;
    --accent: #7fb0b6;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    overflow: hidden; /* single-viewport experience, nothing to scroll */
    overscroll-behavior: none;
  }

  body{
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-weight: 300;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100dvh;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- video layer ---- */

  .video-wrap{
    position: absolute;
    inset: 0;
  }

  #portrait{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
  }

  /* soft vignette so overlaid text stays legible without hiding the subject */
  .vignette{
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(4,6,7,0.55) 0%, rgba(4,6,7,0) 22%, rgba(4,6,7,0) 72%, rgba(4,6,7,0.6) 100%),
      linear-gradient(90deg, rgba(4,6,7,0.45) 0%, rgba(4,6,7,0) 30%);
  }

  /* ---- corner tracking brackets ----
     a quiet nod to the fact that the subject is visually tracking the cursor,
     doubling as a simple frame for the stage */
  .bracket{
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1px solid var(--line);
    opacity: .8;
  }
  .bracket.tl{ top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .bracket.br{ bottom: 28px; right: 28px; border-left: none; border-top: none; }

  /* ---- copy ---- */

  .kicker{
    position: absolute;
    top: 32px;
    left: 56px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--muted);
  }

  .heading{
    position: absolute;
    left: 56px;
    bottom: 96px;
    max-width: 360px;
  }

  .heading h1{
    margin: 0 0 10px;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.05;
  }

  .heading p{
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    font-weight: 300;
    max-width: 320px;
  }

  .hint{
    position: absolute;
    right: 56px;
    bottom: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.6s ease;
  }

  .hint .dot{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .hint.is-hidden{
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce){
    .hint{ transition: none; }
  }

  /* ---- small screens: stack content, keep the face the focus ---- */
  @media (max-width: 640px){
    .kicker{ left: 24px; top: 20px; }
    .bracket.tl{ top: 20px; left: 20px; }
    .bracket.br{ bottom: 20px; right: 20px; }
    .heading{ left: 24px; right: 24px; bottom: 84px; max-width: none; }
    .heading p{ max-width: 280px; }
    .hint{ left: 24px; right: auto; bottom: 32px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="video-wrap">
    <video
      id="portrait"
      src="portrait-left.mp4"
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
      aria-hidden="true"
    ></video>
    <div class="vignette"></div>
  </div>

  <div class="bracket tl"></div>
  <div class="bracket br"></div>

  <div class="kicker">Presence</div>

  <div class="heading">
    <h1>She turns to find you.</h1>
    <p>Move your cursor across the screen. Her gaze follows.</p>
  </div>

  <div class="hint" id="hint">
    <span class="dot"></span>
    <span>move to begin</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /*
   * ---------------------------------------------------------------------
   * VIDEO TIMELINE
   * ---------------------------------------------------------------------
   * The source video was inspected frame-by-frame (at 0.25s resolution,
   * then refined to 0.1s) to find the three poses the interaction needs:
   *
   *   - the character holds a stable LEFT-facing pose from roughly
   *     0.0s to 0.6s
   *   - she rotates continuously rightward and holds a stable, fully
   *     profiled RIGHT-facing pose from roughly 3.5s to 4.0s
   *   - she rotates back and holds a stable, forward-facing CENTER pose
     *   from roughly 5.0s to the end of the clip (8.0s)
   *
   * One timestamp from the middle of each plateau was picked so small
   * playback/seek variance never lands on a transitional (blurred or
   * blinking) frame.
   *
   * Each entry below is a self-contained "directional video" definition,
   * so a second clip can be dropped in later (see FUTURE VIDEOS, below)
   * without touching the interaction logic.
   * ---------------------------------------------------------------------
   */
  var VIDEOS = {
    left: {
      src: "portrait-left.mp4",
      LEFT_START_TIME: 0.10,   // holds LEFT
      RIGHT_TIME: 3.80,        // holds RIGHT (deepest, stable profile)
      CENTER_TIME: 7.50        // holds CENTER (stable, well before the 8.0s end)
    }
    // FUTURE SECOND VIDEO:
    // A "right" entry can be added here, e.g. covering CENTER -> RIGHT,
    // so the two clips together cover a full LEFT <-> RIGHT range. The
    // interaction below only needs a { src, LEFT_START_TIME, RIGHT_TIME,
    // CENTER_TIME } shape and a rule for which entry is active, so wiring
    // in a second clip is additive, not a rewrite.
  };

  var active = VIDEOS.left;

  var video = document.getElementById("portrait");
  var hint = document.getElementById("hint");
  video.src = active.src;

  /*
   * ---------------------------------------------------------------------
   * CURSOR -> TIMELINE MAPPING
   * ---------------------------------------------------------------------
   * cursorProgress 0..1 maps across the timeline in two pieces, because
   * the midpoint of the cursor's travel (50%) corresponds to the video's
   * RIGHT pose, not its CENTER pose:
   *
   *   0%   -> LEFT_START_TIME
   *   50%  -> RIGHT_TIME
   *   100% -> CENTER_TIME
   *
   * A single linear map from 0-100% straight to LEFT_START_TIME-CENTER_TIME
   * would place RIGHT_TIME in the middle only by coincidence, and would
   * not let the character actually reach the RIGHT pose at the cursor's
   * midpoint. Piecewise interpolation is what makes cursor 50% land
   * exactly on RIGHT_TIME, and keeps the mapping continuous there.
   * ---------------------------------------------------------------------
   */
  function targetTimeFor(progress){
    progress = Math.min(1, Math.max(0, progress));
    if (progress <= 0.5){
      var t = progress / 0.5; // 0..1 across the first half
      return active.LEFT_START_TIME + (active.RIGHT_TIME - active.LEFT_START_TIME) * t;
    } else {
      var t2 = (progress - 0.5) / 0.5; // 0..1 across the second half
      return active.RIGHT_TIME + (active.CENTER_TIME - active.RIGHT_TIME) * t2;
    }
  }

  /*
   * ---------------------------------------------------------------------
   * SMOOTH SCRUBBING
   * ---------------------------------------------------------------------
   * Assigning video.currentTime on every mousemove tracks the cursor
   * too literally and reads as jittery/robotic. Instead we keep a
   * running "currentTime" value that eases toward "targetTime" once per
   * animation frame - decoupled from how often mousemove actually
   * fires - which is what gives the motion its cinematic, slightly
   * trailing quality.
   * ---------------------------------------------------------------------
   */
  // TIME_CONSTANT: how eagerly small cursor moves are followed. Bigger
  // = lazier/more cinematic trailing on ordinary, moderate mouse moves.
  var TIME_CONSTANT = 0.20; // seconds
  // MAX_TURN_RATE: a hard speed limit, in video-seconds advanced per
  // real second. This is the actual fix for the "she's already fully
  // turned by the time the cursor reaches the middle" problem: a plain
  // percentage catch-up (old code: displayedTime += delta * 0.08) takes
  // its biggest step on the very first frame after a fast mouse flick,
  // which can jump most of the way across the LEFT<->RIGHT turn
  // instantly - skipping over the in-between turning frames instead of
  // playing through them. Capping the rate means a fast flick still
  // starts the catch-up immediately, but the video is forced to
  // actually play through its own footage at close to its natural
  // turning speed, the same head-turn the camera actually recorded,
  // rather than jump-cutting to the destination pose.
  var MAX_TURN_RATE = 1.6; // 1.0 = exactly real-time; >1 stays responsive without jump-cutting
  var SETTLE_EPSILON = 0.004; // stop nudging currentTime once this close (avoids needless seeks)

  var targetTime = active.LEFT_START_TIME;
  var displayedTime = active.LEFT_START_TIME;
  var hasInteracted = false;
  var rafId = null;
  var lastFrameAt = null;

  function setCursorProgress(clientX){
    var progress = clientX / window.innerWidth;
    targetTime = targetTimeFor(progress);
    if (!hasInteracted){
      hasInteracted = true;
      hint.classList.add("is-hidden");
    }
  }

  function tick(timestampMs){
    if (lastFrameAt === null) lastFrameAt = timestampMs;
    // Clamp dt so a backgrounded tab / dropped frames can't produce one
    // huge catch-up step when the page regains focus.
    var dt = Math.min((timestampMs - lastFrameAt) / 1000, 0.1);
    lastFrameAt = timestampMs;

    var delta = targetTime - displayedTime;
    if (Math.abs(delta) > SETTLE_EPSILON && dt > 0){
      var easeStep = delta * (1 - Math.exp(-dt / TIME_CONSTANT));
      var maxStep = MAX_TURN_RATE * dt;
      if (easeStep > maxStep) easeStep = maxStep;
      if (easeStep < -maxStep) easeStep = -maxStep;
      displayedTime += easeStep;
      // Guard against seeking past a video that hasn't buffered enough yet.
      if (video.readyState >= 2){
        video.currentTime = displayedTime;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function start(){
    if (rafId === null){
      rafId = requestAnimationFrame(tick);
    }
  }

  /*
   * ---------------------------------------------------------------------
   * INITIAL STATE
   * ---------------------------------------------------------------------
   * The video never autoplays or runs on its own. Once metadata is
   * available we seek once to the resting LEFT pose and wait there for
   * the first cursor/touch input.
   * ---------------------------------------------------------------------
   */
  function initPose(){
    video.pause();
    if (video.readyState >= 1){
      video.currentTime = active.LEFT_START_TIME;
    }
  }
  video.addEventListener("loadedmetadata", initPose);
  if (video.readyState >= 1) initPose();

  window.addEventListener("mousemove", function(e){
    setCursorProgress(e.clientX);
    start();
  }, { passive: true });

  /*
   * Touch support: horizontal touch position drives the same timeline.
   * The page has no scrollable content (single fixed-height stage), so
   * capturing touchmove here doesn't fight normal page scrolling.
   */
  window.addEventListener("touchstart", function(e){
    if (e.touches && e.touches.length){
      setCursorProgress(e.touches[0].clientX);
      start();
    }
  }, { passive: true });

  window.addEventListener("touchmove", function(e){
    if (e.touches && e.touches.length){
      setCursorProgress(e.touches[0].clientX);
      start();
    }
  }, { passive: true });

  // Keep the resting pose correct if the window is resized before any input.
  window.addEventListener("resize", function(){
    if (!hasInteracted) initPose();
  });
})();
</script>

</body>
</html>
